@for (pos of positions; track pos) {
  @if (byPos(pos).length > 0) {
    <div class="t-container" [class]="'tc-' + pos">
      @for (toast of byPos(pos); track toast.id) {
        <div class="t-item" [class]="'t-' + toast.type" role="alert">
          <span class="t-icon">{{ icon(toast.type) }}</span>
          <div class="t-body">
            @if (toast.title) { <div class="t-title">{{ toast.title }}</div> }
            <div class="t-msg">{{ toast.message }}</div>
          </div>
          <button class="t-close" (click)="svc.dismiss(toast.id)">✕</button>
          @if (toast.duration > 0) {
            <div class="t-progress" [style.animation-duration.ms]="toast.duration"></div>
          }
        </div>
      }
    </div>
  }
}
